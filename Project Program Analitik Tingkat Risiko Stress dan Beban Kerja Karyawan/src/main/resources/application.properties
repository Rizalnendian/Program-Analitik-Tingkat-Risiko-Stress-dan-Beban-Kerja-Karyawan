spring.application.name=analitik-beban-kerja
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/analitik_beban_kerja?useSSL=false&serverTimezone=Asia/Jakarta&allowPublicKeyRetrieval=true
