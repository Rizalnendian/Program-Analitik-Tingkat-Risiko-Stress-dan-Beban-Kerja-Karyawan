<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Registration Form</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet"
        />
        <link rel="icon" type="image/svg+xml" href="../LOGO warna.svg" />
        <link rel="stylesheet" href="../CSS/signup.css" />
    </head>
    <body>
        <div class="form-container">
            <!-- Tombol Close (X) -->
            <div class="close-btn">
                <a class="close" href="../html/index.html">&times;</a>
            </div>

            <!-- Judul Form -->
            <h2 class="form-title">
                <span>•</span> Registration Form <span>•</span>
            </h2>

            <form action="#">
                <!-- Input Nama -->
                <div class="input-group">
                    <span class="dot">•</span>
                    <input type="text" placeholder="Nama lengkap" required />
                </div>

                <!-- Input Email -->
                <div class="input-group">
                    <span class="dot">•</span>
                    <input type="email" placeholder="Email" required />
                </div>

                <!-- Dropdown Role -->
                <div class="input-group">
                    <span class="dot">•</span>
                    <select required>
                        <option value="" disabled selected hidden>Role</option>
                        <option value="Manajer">Manajer</option>
                        <option value="Staf">Staf</option>
                    </select>
                    <span class="arrow-icon">▼</span>
                </div>

                <!-- Input Jenis kelamin -->
                <div class="input-group">
                    <span class="dot">•</span>
                    <select required>
                        <option value="" disabled selected hidden>
                            Jenis Kelamin
                        </option>
                        <option value="Laki-laki">Laki-laki</option>
                        <option value="Perempuan">Perempuan</option>
                    </select>
                    <span class="arrow-icon">▼</span>
                </div>

                <!-- Input Divisi -->
                <div class="input-group">
                    <span class="dot">•</span>
                    <input type="text" placeholder="Divisi" required />
                </div>

                <!-- Input Password -->
                <div class="input-group">
                    <span class="dot">•</span>
                    <input type="password" placeholder="Password" required />
                    <span class="eye-icon">👁</span>
                </div>

                <!-- Checkbox Persyaratan -->
                <div class="checkbox-group">
                    <input type="checkbox" id="terms" required />
                    <label for="terms"
                        >Ceklis jika data yang diinput sudah benar dan tidak ada
                        kesalahan penulisan maupun data.
                    </label>
                </div>

                <!-- Tombol Submit -->
                <button type="submit" class="submit-btn">CREATE ACCOUNT</button>

                <!-- Link Login -->
                <p class="footer-text">
                    Already have an account?
                    <a href="../html/index.html">Sign in</a>
                </p>
            </form>
        </div>
        <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    </body>
</html>
